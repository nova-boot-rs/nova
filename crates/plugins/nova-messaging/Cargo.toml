[package]
name = "nova-messaging"
edition.workspace = true
version.workspace = true
description = "Messaging abstraction and adapters (NATS/Kafka/RabbitMQ) for Nova"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microservices", "axum", "web", "nova"]
categories = ["web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nova-core = { path = "../../nova-core", version = "0.1.0" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-nats = "0.38"
lapin = "2"
rdkafka = { version = "0.39", features = ["cmake-build", "curl-static"] }
futures-util = "0.3"
axum.workspace = true
