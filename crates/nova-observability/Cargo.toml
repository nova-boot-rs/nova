[package]
name = "nova-observability"
edition.workspace = true
version.workspace = true
description = "Observability helpers and tracing initialization for Nova"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microservices", "axum", "web", "nova"]
categories = ["web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
axum.workspace = true
tower-http = { workspace = true, features = ["request-id"] }
tracing.workspace = true
tracing-subscriber.workspace = true
inventory.workspace = true
serde_json.workspace = true
nova-core = { path = "../nova-core", version = "0.1.0" }
