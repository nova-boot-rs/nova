[package]
name = "nova-data-patterns"
edition.workspace = true
version.workspace = true

[dependencies]
nova-core = { path = "../nova-core" }
nova-sql = { path = "../plugins/nova-sql", optional = true }
nova-nosql = { path = "../plugins/nova-nosql", optional = true }
nova-messaging = { path = "../plugins/nova-messaging", optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
redis = { workspace = true, optional = true }

[features]
default = []
sql-bridge = ["nova-sql"]
nosql-bridge = ["nova-nosql"]
messaging-bridge = ["nova-messaging"]
redis-store = ["dep:redis"]
