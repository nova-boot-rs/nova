[package]
name = "nova-data-patterns"
edition.workspace = true
version.workspace = true
description = "CQRS, event sourcing and saga patterns for Nova"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microservices", "axum", "web", "nova"]
categories = ["web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nova-boot = { path = "../nova-boot", version = "0.1.0" }
nova-sql = { path = "../plugins/nova-sql", version = "0.1.0", optional = true }
nova-nosql = { path = "../plugins/nova-nosql", version = "0.1.0", optional = true }
nova-messaging = { path = "../plugins/nova-messaging", version = "0.1.0", optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
redis = { workspace = true, optional = true }

[features]
default = []
sql-bridge = ["nova-sql"]
nosql-bridge = ["nova-nosql"]
messaging-bridge = ["nova-messaging"]
redis-store = ["dep:redis"]
