on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            kafka:
                image: confluentinc/cp-kafka:latest
                ports:
                    - 9092:9092
                env:
                    KAFKA_NODE_ID: 1
                    KAFKA_PROCESS_ROLES: broker,controller
                    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
                    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
                    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
                    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
                    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
                    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                    CLUSTER_ID: test-cluster-1
                options: >-
                    --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
                    --health-interval 10s
                    --health-timeout 10s
                    --health-retries 10

            rabbitmq:
                image: rabbitmq:3-management-alpine
                ports:
                    - 5672:5672
                options: >-
                    --health-cmd "rabbitmq-diagnostics check_port_connectivity"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            nats:
                image: nats:latest
                ports:
                    - 4222:4222
                options: >-
                    --health-cmd "nats server check connection"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 3

        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            - name: Install protoc
              run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --workspace --all-features -- -D warnings

            - name: Build
              run: cargo build --workspace --all-features

            - name: Unit tests
              run: cargo test --workspace --all-features

            - name: Redis integration tests
              env:
                NOVA_TEST_REDIS_URL: redis://127.0.0.1:6379/
              run: cargo test -p nova-core --features redis-store -- --ignored redis

            - name: Kafka integration tests
              env:
                KAFKA_BROKERS: 127.0.0.1:9092
              run: cargo test -p nova-messaging --features kafka -- --ignored kafka

            - name: RabbitMQ integration tests
              env:
                RABBITMQ_URL: amqp://127.0.0.1:5672
              run: cargo test -p nova-messaging -- --ignored rabbitmq

            - name: NATS integration tests
              env:
                NATS_URL: nats://127.0.0.1:4222
              run: cargo test -p nova-messaging -- --ignored nats