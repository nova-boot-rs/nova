on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2      # fast, caches deps
            - run: cargo fmt --check
            - run: cargo clippy -- -D warnings
            - run: cargo test