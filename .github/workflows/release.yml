name: Release

on:
    push:
        tags: ["v*.*.*"]

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable

            - name: Build & test
              run: |
                cargo build --workspace --all-features
                cargo test --workspace --all-features

            - name: Dry-run publishes
              run: |
                crates=(
                    "nova-boot-resilience-store"
                    "nova-boot-macros"
                    "nova-boot"
                    "nova-boot-observability"
                    "nova-boot-middleware"
                    "nova-boot-discovery"
                    "nova-boot-sql"
                    "nova-boot-nosql"
                    "nova-boot-graphdb"
                    "nova-boot-messaging"
                    "nova-boot-data-patterns"
                    "nova-boot-discovery-consul"
                    "nova-boot-discovery-etcd"
                    "nova-boot-discovery-dns"
                    "nova-boot-discovery-static"
                    "nova-boot-client"
                    "nova-boot-gateway"
                    "nova-boot-auth"
                    "nova-boot-test"
                    "nova-boot-cli"
                    "nova-boot-tasks"
                )
                for crate in "${crates[@]}"; do
                    echo "Dry-run: $crate"
                    cargo publish -p "$crate" --dry-run || {
                        echo "FAILED dry-run for $crate"
                        exit 1
                    }
                done

            - name: Publish to crates.io
              env:
                CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: |
                crates=(
                    "nova-boot-resilience-store"
                    "nova-boot-macros"
                    "nova-boot"
                    "nova-boot-observability"
                    "nova-boot-middleware"
                    "nova-boot-discovery"
                    "nova-boot-sql"
                    "nova-boot-nosql"
                    "nova-boot-graphdb"
                    "nova-boot-messaging"
                    "nova-boot-data-patterns"
                    "nova-boot-discovery-consul"
                    "nova-boot-discovery-etcd"
                    "nova-boot-discovery-dns"
                    "nova-boot-discovery-static"
                    "nova-boot-client"
                    "nova-boot-gateway"
                    "nova-boot-auth"
                    "nova-boot-test"
                    "nova-boot-cli"
                    "nova-boot-tasks"
                )
                for crate in "${crates[@]}"; do
                    echo "Publishing $crate..."
                    cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
                    echo "Waiting for crates.io index update..."
                    sleep 30
                done

            - uses: softprops/action-gh-release@v2
              with:
                generate_release_notes: true