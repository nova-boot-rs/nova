on:
    push:
        tags: ["v*.*.*"]          # triggers on v0.1.0, v1.2.3, etc.

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo test          # sanity check before publishing
            - run: cargo publish       # pushes to crates.io
              env:
                CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
            - uses: softprops/action-gh-release@v2   # creates GitHub Release
              with:
                generate_release_notes: true